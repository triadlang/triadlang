[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "triadlang"
version = "1.0.0"
description = "TriadLang — a programming language whose runtime is the Triad equation"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "qrv0" }
]
keywords = [
    "triad",
    "triadlang",
    "nonlinear-schrodinger",
    "quantum-substrate",
    "fluctuation-dissipation",
    "wave-computing",
    "compiler",
    "programming-language",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: Other/Proprietary License",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]

dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
science = ["scipy>=1.10"]
viz = ["matplotlib>=3.7"]
gpu = ["cupy-cuda12x"]
lsp = ["pygls>=1.0"]
quantum = ["qiskit>=1.0", "qiskit-aer>=0.14", "cirq>=1.3"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
all = ["scipy>=1.10", "matplotlib>=3.7", "pygls>=1.0", "fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
dev = ["pytest", "ruff", "black"]

[project.scripts]
triad = "cli.main:main"

[project.urls]
Homepage = "https://triadlang.com"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cli*", "runtime*", "runtime.core*", "runtime.ml*", "runtime.physics*", "runtime.codec*", "compiler*", "frontend*", "stdlib*", "api*", "embed*", "adapters*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]
